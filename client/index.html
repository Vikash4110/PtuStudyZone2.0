<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>

    <!-- Favicon -->
    <link rel="icon" href="/client/src/assets/mainlogo.png" type="image/x-icon" />
    <link rel="icon" href="/client/src/assets/mainlogo.png" type="image/png" />
    <link rel="icon" href="/client/src/assets/mainlogo.png" type="image/svg+xml" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Study Material Website for Ptu Students" />
    <meta name="keywords" content=", PTU STUDY ZONE , ptuwebsite,PTU, React, Vite, JavaScript, Web Development" />
    <meta name="author" content="Vikash Bharal" />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="Vite + React Website" />
    <meta property="og:description" content="Study Material Website for Ptu Students" />
    <meta property="og:image" content="/client/src/assets/mainlogo.png" />
    <meta property="og:url" content="https://www.ptustudyzone.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vite + React Website" />
    <meta name="twitter:description" content="A brief description of your website for Twitter shares." />
    <meta name="twitter:image" content="/path/to/your/preview-image.png" />

    <!-- Additional Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#317EFB" /> <!-- Sets the browser color on mobile devices -->
    <meta name="robots" content="index, follow" /> <!-- Controls how search engines index the page -->

    <!-- Preconnect and Prefetching for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    
    <!-- Import Google Fonts (Optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/path/to/your/styles.css" /> <!-- Replace with your stylesheet path -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
